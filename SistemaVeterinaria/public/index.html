<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Veterinaria - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .bg-pattern {
      background-color: #0f172a;
      background-image: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Decoración de fondo con huellas -->
  <div class="absolute -top-12 -left-12 text-emerald-500/10 text-9xl pointer-events-none transform -rotate-12">
    <i class="fa-solid fa-paw"></i>
  </div>
  <div class="absolute -bottom-16 -right-16 text-teal-500/10 text-[14rem] pointer-events-none transform rotate-45">
    <i class="fa-solid fa-paw"></i>
  </div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Encabezado con logotipo de Veterinaria -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-white shadow-lg shadow-emerald-500/30 mb-3 transform transition hover:scale-105 duration-300">
        <i class="fa-solid fa-user-nurse text-4xl"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">VetCare Pro</h1>
      <p class="text-slate-400 text-sm mt-1">Sistema de Gestión e Historial Clínico Veterinario</p>
    </div>

    <!-- Tarjeta del Formulario -->
    <div class="bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-3xl p-8 shadow-2xl">
      <h2 class="text-xl font-bold text-slate-100 mb-6 flex items-center gap-2">
        <i class="fa-solid fa-right-to-bracket text-emerald-400"></i> Iniciar Sesión
      </h2>

      <form id="formLogin" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Nombre de Usuario</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i class="fa-solid fa-user"></i>
            </div>
            <input type="text" id="usuario" class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" placeholder="Ej: admin" required>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Contraseña</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input type="password" id="clave" class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="btnIngresar" class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition duration-200 flex items-center justify-center gap-2 group">
          <span>Ingresar al Sistema</span>
          <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
        </button>
      </form>

      <!-- Mensaje de Error -->
      <div id="error" class="hidden mt-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center font-medium"></div>

      <!-- Acceso Rápido de Prueba -->
      <div class="mt-8 pt-6 border-t border-slate-800">
        <p class="text-xs font-semibold text-slate-400 text-center mb-3">Prueba Rápida por Rol (Autocompletar):</p>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="autocompletar('admin', '1234')" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-xs font-medium text-purple-300 text-center transition">
            <i class="fa-solid fa-user-shield block text-sm mb-1 text-purple-400"></i> Admin
          </button>
          <button onclick="autocompletar('vet1', '1234')" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-xs font-medium text-emerald-300 text-center transition">
            <i class="fa-solid fa-user-md block text-sm mb-1 text-emerald-400"></i> Médico
          </button>
          <button onclick="autocompletar('pasante1', '1234')" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-xs font-medium text-blue-300 text-center transition">
            <i class="fa-solid fa-user-graduate block text-sm mb-1 text-blue-400"></i> Pasante
          </button>
        </div>
      </div>
    </div>

    <p class="text-center text-xs text-slate-500 mt-6">
      &copy; 2026 VetCare Pro - Control de Acceso Basado en Roles (RBAC)
    </p>
  </div>

  <script>
    function autocompletar(u, c) {
      document.getElementById('usuario').value = u;
      document.getElementById('clave').value = c;
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value;
      const clave = document.getElementById('clave').value;
      const errorDiv = document.getElementById('error');
      const btn = document.getElementById('btnIngresar');

      errorDiv.classList.add('hidden');
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Autenticando...`;

      try {
        const respuesta = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, clave })
        });

        const datos = await respuesta.json();

        if (respuesta.ok) {
          localStorage.setItem('rolUsuario', datos.rol);
          localStorage.setItem('nombreUsuario', datos.nombre);
          localStorage.setItem('userTag', datos.usuario);
          window.location.href = datos.redirectUrl;
        } else {
          errorDiv.innerText = datos.mensaje || 'Error al iniciar sesión';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.innerText = 'Error de conexión con el servidor Node.js';
        errorDiv.classList.remove('hidden');
      } finally {
        btn.innerHTML = `<span>Ingresar al Sistema</span> <i class="fa-solid fa-arrow-right"></i>`;
      }
    });
  </script>
</body>
</html>
